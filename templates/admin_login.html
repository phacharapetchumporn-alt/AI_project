<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบหลังบ้าน | SignSubs Admin Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0c16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Ambient Glow Backgrounds */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: rgba(99, 102, 241, 0.2);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(6, 182, 212, 0.15);
            bottom: -100px;
            right: -100px;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .brand-title {
            font-family: 'Outfit', 'Kanit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 40%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-control {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.85);
        }

        .input-control:focus+.input-icon,
        .input-wrapper:focus-within i.input-icon {
            color: var(--primary);
        }

        .toggle-pw-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-pw-btn:hover {
            color: #fff;
        }

        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.86rem;
            margin-bottom: 18px;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s;
            box-shadow: 0 8px 20px -6px var(--primary-glow);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #7073f4, #4338ca);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .demo-hint {
            margin-top: 22px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: center;
        }

        .demo-hint code {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="login-container">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="brand-title">SignSubs Admin</h1>
            <p class="brand-subtitle">ระบบจัดการและควบคุมหลังบ้านอัจฉริยะ</p>
            <div class="admin-badge">
                <i class="fa-solid fa-lock"></i> เขตควบคุมเฉพาะผู้ดูแลระบบ
            </div>
        </div>

        <div class="alert-box alert-error" id="login-alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="login-alert-text">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
        </div>

        <form id="admin-login-form">
            <div class="form-group">
                <label class="form-label" for="admin-username">ชื่อผู้ใช้หรืออีเมลผู้ดูแล</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="admin-username" class="input-control" placeholder="admin" required autofocus
                        autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="admin-password">รหัสผ่าน</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" id="admin-password" class="input-control" placeholder="••••••" required
                        autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" id="btn-toggle-pw" aria-label="Toggle Password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-login-submit">
                <span>เข้าสู่ระบบหลังบ้าน</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="demo-hint">
            <i class="fa-solid fa-circle-info"></i> บัญชีเริ่มต้น: ผู้ใช้ <code>admin</code> | รหัสผ่าน
            <code>123456</code>
        </div>

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลัก SignSubs
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yotvhpskwnmhupvaxenf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_z8cNBJEv-QhG8ULD8yg63A_RdZeaXGa';
        let supabaseClient = null;

        if (window.supabase && typeof window.supabase.createClient === 'function') {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (e) {
                console.warn("Supabase initialization error:", e);
            }
        }

        const form = document.getElementById('admin-login-form');
        const alertBox = document.getElementById('login-alert');
        const alertText = document.getElementById('login-alert-text');
        const btnSubmit = document.getElementById('btn-login-submit');
        const btnTogglePw = document.getElementById('btn-toggle-pw');
        const pwInput = document.getElementById('admin-password');
        const usernameInput = document.getElementById('admin-username');

        if (btnTogglePw && pwInput) {
            btnTogglePw.addEventListener('click', () => {
                const isPassword = pwInput.type === 'password';
                pwInput.type = isPassword ? 'text' : 'password';
                btnTogglePw.innerHTML = isPassword ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
            });
        }

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (alertBox) alertBox.style.display = 'none';

                const username = usernameInput ? usernameInput.value.trim() : '';
                const password = pwInput ? pwInput.value : '';

                if (!username || !password) return;

                if (btnSubmit) {
                    btnSubmit.disabled = true;
                    btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบสิทธิ์...';
                }

                try {
                    if (!supabaseClient) {
                        throw new Error("Supabase Client is not initialized");
                    }

                    // ใช้ชื่อตัวแปร supaUsers และ supaErr ให้สอดคล้องกัน
                    const { data: supaUsers, error: supaErr } = await supabaseClient
                        .from('users')
                        .select('*')
                        .or(`username.eq.${username},email.eq.${username}`)
                        .eq('password', password)
                        .eq('role', 'admin')
                        .limit(1);

                    if (!supaErr && supaUsers && supaUsers.length > 0) {
                        if (btnSubmit) btnSubmit.innerHTML = '<i class="fa-solid fa-check"></i> สำเร็จ! กำลังเข้าสู่ระบบ...';

                        localStorage.setItem('signsubs_current_user', JSON.stringify(supaUsers[0]));

                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        if (alertText) alertText.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง หรือคุณไม่มีสิทธิ์เข้าถึงระบบ Admin';
                        if (alertBox) alertBox.style.display = 'flex';
                        if (btnSubmit) {
                            btnSubmit.disabled = false;
                            btnSubmit.innerHTML = '<span>เข้าสู่ระบบหลังบ้าน</span> <i class="fa-solid fa-arrow-right"></i>';
                        }
                    }
                } catch (err) {
                    console.error(err);
                    if (alertText) alertText.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
                    if (alertBox) alertBox.style.display = 'flex';
                    if (btnSubmit) {
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = '<span>เข้าสู่ระบบหลังบ้าน</span> <i class="fa-solid fa-arrow-right"></i>';
                    }
                }
            });
        }
    </script>
</body>

</html>
